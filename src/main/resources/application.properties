# ============================================================
# Online Bookstore - Application Configuration
# ============================================================

# Server port (default: 8080)
server.port=8080

# ============================================================
# DATABASE CONFIGURATION
# ============================================================

# --- Option 1: H2 In-Memory Database (Default - No setup needed) ---
# Use this for quick start without installing MySQL
spring.datasource.url=jdbc:h2:mem:bookstoredb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 Console (access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- Option 2: MySQL Database (Uncomment to use MySQL) ---
# Step 1: Create database: CREATE DATABASE bookstoredb;
# Step 2: Update username and password below
# Step 3: Comment out the H2 section above

# spring.datasource.url=jdbc:mysql://localhost:3306/bookstoredb?useSSL=false&serverTimezone=UTC
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=root
# spring.datasource.password=yourpassword
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# ============================================================
# JPA / HIBERNATE CONFIGURATION
# ============================================================

# Auto creates/updates database tables based on entity classes
spring.jpa.hibernate.ddl-auto=create-drop

# Show SQL queries in console (helpful for debugging)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ============================================================
# CORS & STATIC RESOURCES
# ============================================================

# Allow frontend (HTML files) to call backend APIs
spring.web.resources.static-locations=classpath:/static/

# Application name
spring.application.name=online-bookstore

# Logging level
logging.level.com.bookstore=DEBUG
